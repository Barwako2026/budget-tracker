<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">

    <aside class="sidebar">
      <h2 class="logo">SpendWise</h2>
      <nav class="nav-menu">
        <a href="#" class="nav-item active">Dashboard</a>
        <a href="#" class="nav-item">Expenses</a>
        <a href="#" class="nav-item">Income</a>
        <a href="#" class="nav-item">Reports</a>
        <a href="#" class="nav-item">Settings</a>
      </nav>
    </aside>

    <header class="header">
      <h1>Welcome back, Barwako</h1>
      <div class="header-actions">
        <span class="header-date">September 2026</span>
        <button class="header-btn">+ Add Expense</button>
      </div>
    </header>

    <main class="cards-grid">

      <div class="card" tabindex="0">
        <h3>Food</h3>
        <p class="amount">$245.00</p>
        <p class="sub-text">This month</p>
      </div>

      <div class="card" tabindex="0">
        <h3>Transport</h3>
        <p class="amount">$120.00</p>
        <p class="sub-text">This month</p>
      </div>

      <div class="card" tabindex="0">
        <h3>Rent</h3>
        <p class="amount">$800.00</p>
        <p class="sub-text">This month</p>
      </div>

      <div class="card" tabindex="0">
        <h3>Entertainment</h3>
        <p class="amount">$60.00</p>
        <p class="sub-text">This month</p>
      </div>

      <div class="card" tabindex="0">
        <h3>Savings</h3>
        <p class="amount">$300.00</p>
        <p class="sub-text">This month</p>
      </div>

      <div class="card" tabindex="0">
        <h3>Utilities</h3>
        <p class="amount">$95.00</p>
        <p class="sub-text">This month</p>
      </div>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
